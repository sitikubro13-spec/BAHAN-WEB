<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Superadmin - Tabayyun Digital</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-ma-shirothul-fuqoha.svg">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  
  <style>
    body {
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    
    .login-container {
      background: white;
      padding: 3rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    
    .login-logo {
      width: 80px;
      margin-bottom: 1rem;
    }
    
    .login-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      color: var(--color-primary-950);
      margin-bottom: 0.5rem;
    }
    
    .login-subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    
    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }
    
    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #334155;
      font-size: 0.9rem;
    }
    
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--color-primary-600);
      box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.2);
    }
    
    .login-btn {
      width: 100%;
      margin-top: 1rem;
    }
    
    .error-msg {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #f87171;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--color-primary-700);
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    
    .back-link:hover {
      color: var(--color-primary-900);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="assets/images/logo-ma-shirothul-fuqoha.svg" alt="Logo" class="login-logo">
    <h1 class="login-title">Portal Superadmin</h1>
    <p class="login-subtitle">Silakan login untuk mengakses dashboard laporan.</p>
    
    <div id="loginError" class="error-msg">Username atau password salah!</div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn btn--primary login-btn">Login ke Dashboard</button>
    </form>
    
    <a href="index.html" class="back-link">← Kembali ke Halaman Utama</a>
  </div>

  <script src="assets/js/superadmin.js"></script>
</body>
</html>
