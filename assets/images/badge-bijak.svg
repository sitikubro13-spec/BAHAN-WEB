<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="bgBijak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#bgBijak)" stroke="#3b82f6" stroke-width="3" filter="url(#glowBlue)"/>
  <rect x="14" y="14" width="72" height="72" rx="18" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Magnifier & Star of Wisdom -->
  <circle cx="45" cy="45" r="16" stroke="url(#starGrad)" stroke-width="3.5" fill="#ffffff" fill-opacity="0.9"/>
  <line x1="56" y1="56" x2="72" y2="72" stroke="#1e40af" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Inner Star -->
  <polygon points="45,35 48,42 55,42 50,46 52,53 45,49 38,53 40,46 35,42 42,42" fill="#f59e0b"/>
</svg>
