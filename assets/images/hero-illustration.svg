<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="50%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Decorative Circles & Islamic Arch Aura -->
  <circle cx="300" cy="250" r="210" fill="url(#heroBgGrad)" opacity="0.7"/>
  <circle cx="300" cy="250" r="240" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="300" cy="250" r="180" fill="none" stroke="#059669" stroke-width="1" opacity="0.3"/>

  <!-- Floating UI Badges (Tabayyun, No Bullying, Akhlak) -->
  <!-- Floating Card 1: Shield / Tabayyun Verified -->
  <g transform="translate(60, 90)" filter="url(#heroShadow)">
    <rect width="160" height="52" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="16" fill="#ecfdf5"/>
    <path d="M28 16 L38 21 V27 C38 33 28 38 28 38 C28 38 18 33 18 27 V21 L28 16 Z" fill="#10b981"/>
    <path d="M25 26 L27 28 L32 23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="23" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#064e3b">TABAYYUN DULU</text>
    <text x="52" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748b">Periksa Sebelum Sebar</text>
  </g>

  <!-- Floating Card 2: Stop Bullying Badge -->
  <g transform="translate(380, 80)" filter="url(#heroShadow)">
    <rect width="165" height="52" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="16" fill="#fef2f2"/>
    <!-- Heart with Hand / Stop Shield -->
    <circle cx="28" cy="26" r="11" fill="#ef4444"/>
    <line x1="22" y1="26" x2="34" y2="26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="52" y="23" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#991b1b">STOP BULLYING</text>
    <text x="52" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748b">Jaga Lisan &amp; Tulisan</text>
  </g>

  <!-- Floating Card 3: QS Al-Hujurat 11 reminder -->
  <g transform="translate(390, 360)" filter="url(#heroShadow)">
    <rect width="170" height="56" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#fffbeb"/>
    <polygon points="28,18 31,24 38,24 33,28 35,35 28,31 21,35 23,28 18,24 25,24" fill="#d97706"/>
    <text x="52" y="24" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#92400e">AKHLAK DIGITAL</text>
    <text x="52" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748b">QS. Al-Hujurat : 11</text>
  </g>

  <!-- Central Smartphone Device Displaying Tabayyun Learning Interface -->
  <g transform="translate(195, 110)" filter="url(#heroShadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="210" height="350" rx="32" fill="url(#phoneGrad)" stroke="#334155" stroke-width="3"/>
    <!-- Speaker & Camera Notch -->
    <rect x="75" y="10" width="60" height="8" rx="4" fill="#0f172a"/>
    <circle cx="120" cy="14" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <!-- Screen -->
    <rect x="10" y="26" width="190" height="308" rx="22" fill="url(#screenGrad)"/>
    
    <!-- Screen Header -->
    <rect x="18" y="38" width="174" height="28" rx="8" fill="#ffffff" fill-opacity="0.15"/>
    <text x="30" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff">MA SHIROTHUL FUQOHA’</text>
    <circle cx="176" cy="52" r="5" fill="#10b981"/>

    <!-- Screen Interactive Post Card Preview -->
    <rect x="18" y="74" width="174" height="135" rx="12" fill="#ffffff"/>
    <circle cx="34" cy="92" r="10" fill="#ecfdf5"/>
    <text x="34" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#047857">TF</text>
    <text x="50" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Tabayyun Check</text>
    <text x="50" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="500" fill="#64748b">Tahan • Amati • Analisis</text>
    
    <!-- Mini Post Mock -->
    <rect x="26" y="110" width="158" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="34" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#1e293b">"Ada kabar viral di grup..."</text>
    <text x="34" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="400" fill="#047857">✔ Cek sumber resmi sekolah</text>
    <text x="34" y="146" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="400" fill="#047857">✔ Jangan sebar jika menyakiti</text>

    <!-- Mini Action Buttons on Phone -->
    <rect x="26" y="160" width="75" height="20" rx="6" fill="#047857"/>
    <text x="63" y="173" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">Tabayyun ✔</text>

    <rect x="108" y="160" width="76" height="20" rx="6" fill="#f1f5f9"/>
    <text x="146" y="173" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#475569">Bantuan</text>

    <!-- Screen Lower Stats -->
    <rect x="18" y="218" width="174" height="48" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="30" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#a7f3d0">Poin Akhlak Santri</text>
    <text x="30" y="254" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#fbbf24">450 XP ⭐</text>

    <rect x="120" y="228" width="62" height="28" rx="6" fill="url(#goldGradHero)"/>
    <text x="151" y="245" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">Duta Akhlak</text>

    <!-- Phone Home Indicator -->
    <line x1="85" y1="322" x2="125" y2="322" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Islamic Student Boy (Santri with Peci & Neat Uniform) - Left side -->
  <g transform="translate(60, 220)">
    <!-- Shadow -->
    <ellipse cx="70" cy="240" rx="45" ry="10" fill="#064e3b" opacity="0.15"/>
    
    <!-- Body / Clothes -->
    <path d="M35 150 Q70 140 105 150 L115 235 L25 235 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Green Vest / Jas Almamater Madrasah -->
    <path d="M35 150 L25 230 L55 230 L60 160 Z" fill="#047857"/>
    <path d="M105 150 L115 230 L85 230 L80 160 Z" fill="#047857"/>
    <!-- Collar & Tie -->
    <polygon points="60,150 70,165 80,150" fill="#047857"/>
    
    <!-- Arms holding device/notebook -->
    <path d="M30 165 Q45 190 75 185" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M110 165 Q95 190 75 185" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" fill="none"/>
    
    <!-- Neck -->
    <rect x="62" y="130" width="16" height="15" fill="#fed7aa" rx="3"/>

    <!-- Head -->
    <ellipse cx="70" cy="105" rx="26" ry="28" fill="#fde68a"/>
    <!-- Peci / Songkok Hitam with gold trim -->
    <path d="M43 95 C43 65 97 65 97 95 Z" fill="#1e293b"/>
    <line x1="43" y1="95" x2="97" y2="95" stroke="#fbbf24" stroke-width="2"/>

    <!-- Face details -->
    <!-- Eyes -->
    <ellipse cx="61" cy="106" rx="2.5" ry="3.5" fill="#0f172a"/>
    <ellipse cx="79" cy="106" rx="2.5" ry="3.5" fill="#0f172a"/>
    <!-- Friendly Smile -->
    <path d="M64 117 Q70 123 76 117" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Blush -->
    <circle cx="56" cy="114" r="3" fill="#f87171" opacity="0.4"/>
    <circle cx="84" cy="114" r="3" fill="#f87171" opacity="0.4"/>
  </g>

  <!-- Islamic Student Girl (Santriwati with Jilbab & Neat Uniform) - Right side -->
  <g transform="translate(430, 220)">
    <!-- Shadow -->
    <ellipse cx="70" cy="240" rx="45" ry="10" fill="#064e3b" opacity="0.15"/>

    <!-- Body / Gamis / Uniform -->
    <path d="M30 150 Q70 142 110 150 L125 235 L15 235 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M35 170 Q70 160 105 170 L115 235 L25 235 Z" fill="#ecfdf5"/>

    <!-- Jilbab / Hijab (Syar'i & Rapi) -->
    <path d="M30 100 C20 135 30 185 70 185 C110 185 120 135 110 100 C110 65 30 65 30 100 Z" fill="#047857"/>
    <!-- Inner Hijab Border -->
    <ellipse cx="70" cy="105" rx="22" ry="24" fill="#fde68a"/>
    <path d="M48 95 Q70 85 92 95" stroke="#064e3b" stroke-width="2.5" fill="none"/>

    <!-- Face details -->
    <!-- Eyes -->
    <ellipse cx="62" cy="106" rx="2.5" ry="3.5" fill="#0f172a"/>
    <ellipse cx="78" cy="106" rx="2.5" ry="3.5" fill="#0f172a"/>
    <!-- Kind Smile -->
    <path d="M65 118 Q70 123 75 118" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Blush -->
    <circle cx="56" cy="114" r="3" fill="#f87171" opacity="0.4"/>
    <circle cx="84" cy="114" r="3" fill="#f87171" opacity="0.4"/>

    <!-- Holding Tablet/Book -->
    <path d="M40 180 Q55 200 70 190" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M100 180 Q85 200 70 190" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="52" y="175" width="36" height="46" rx="4" fill="#064e3b" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="58" y1="185" x2="82" y2="185" stroke="#a7f3d0" stroke-width="1.5"/>
    <line x1="58" y1="193" x2="78" y2="193" stroke="#a7f3d0" stroke-width="1.5"/>
    <line x1="58" y1="201" x2="80" y2="201" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
</svg>
