<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Islamic Geometric Emblem / Placeholder Box -->
  <g transform="translate(10, 8)">
    <!-- Outer Star/Octagon Badge -->
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#primaryGrad)" filter="url(#shadow)" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
    
    <!-- Quran / Book & Light Motif -->
    <!-- Open Book Base -->
    <path d="M 17 44 Q 32 39 32 26 Q 32 39 47 44 L 47 46 Q 32 41 32 28 Q 32 41 17 46 Z" fill="#ffffff" opacity="0.95" />
    <!-- Islamic Dome / Mihrab Arch Arc -->
    <path d="M 23 28 C 23 20 32 16 32 16 C 32 16 41 20 41 28" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Glowing Star of Knowledge -->
    <polygon points="32,19 33.8,23.5 38.5,23.8 35,26.8 36,31.5 32,29 28,31.5 29,26.8 25.5,23.8 30.2,23.5" fill="#fbbf24"/>
    <!-- Central Pen/Ray -->
    <line x1="32" y1="28" x2="32" y2="42" stroke="#047857" stroke-width="1.5"/>
    <!-- Sub-tag on Badge -->
    <text x="32" y="56" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#a7f3d0" letter-spacing="0.5">LOGO RESMI</text>
  </g>

  <!-- Typography: School Identity & Madrasah Label -->
  <g transform="translate(82, 0)">
    <!-- Sub-label -->
    <rect x="0" y="14" width="118" height="15" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="6" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#047857" letter-spacing="0.8">MADRASAH ALIYAH</text>
    
    <!-- Main School Name -->
    <text x="0" y="47" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="16.5" font-weight="800" fill="#064e3b" letter-spacing="-0.2">
      SHIROTHUL FUQOHA’
    </text>

    <!-- Secondary Tagline -->
    <text x="0" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#64748b" letter-spacing="0.2">
      Pesantren &amp; Madrasah Berakhlak Mulia
    </text>
  </g>
</svg>
